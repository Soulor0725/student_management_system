[pytest]
testpaths = unit_test api_test integration_test security_test smoke_test db_test contract_test crud_test reliability_test
markers =
    smoke: 冒烟测试 - 核心路径快速验证
    unit: 单元测试
    api: API接口测试
    integration: 集成测试
    security: 安全测试
    db: 数据库测试
    contract: 接口契约测试
    crud: 数据完整性测试
    reliability: 可靠性测试
    config: 配置测试
addopts = -v --tb=short
